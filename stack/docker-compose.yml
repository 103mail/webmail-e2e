# The test stack the stories run against: four Domains and the scripted
# peer.test, each its own Server with its own SQLite file, API, worker and
# hostname, plus the fault proxy and the mail sink they all share.
#
# It is built from images only, so nothing outside this repo is read:
#   webmail-server:local    the API and the worker (WEBMAIL_SERVER_IMAGE)
#   webmail-client:local    nginx in front of each Domain (WEBMAIL_CLIENT_IMAGE)
#   webmail-faults:local    the fault proxy (WEBMAIL_FAULTS_IMAGE)
#   webmail-mailsink:local  the SNS stand-in (WEBMAIL_MAILSINK_IMAGE)
# Everything else comes from this directory, after setup.sh has made the
# certificates, keys, clock and data directories.
#
# Per Domain:
#   api-*     the Go API server, reachable only on its Domain network, except
#             for its read-only controls (ADR 20), which the suite reaches at
#             control.webmail.{domain}:8081 on the federation network. It
#             creates the schema in its empty database file at start-up.
#   web-*     nginx: the peer descriptor and the API under webmail.{domain},
#             with TLS from the stack's CA.
#   worker-*  drains the federation outbox and sweeps what ages out.
#
# Networks:
#   dom-*       private per Domain. api is not reachable across it.
#   federation  the only shared network. Every web container carries its real
#               Federation hostname as an alias, so Domains, and the suite,
#               resolve webmail.example.com the way they would on the internet.
#
# No host ports: the suite runs in a container on the federation network
# (../run.sh), so this stack can run next to a development stack.
#
# The suite finds a Domain's containers by the project name and the
# webmail.domain label, and recreates them with RETRY_BUDGET_<DOMAIN> or
# FEDERATION_CONFIG_<DOMAIN> set for the length of a story.

name: webmail-e2e

x-api: &api
  image: ${WEBMAIL_SERVER_IMAGE:-webmail-server:local}
  pull_policy: missing
  restart: unless-stopped
  environment: &api-env
    WEBMAIL_ADDR: ":8080"
    WEBMAIL_DATA_DIR: /data
    # The API and the worker of a Domain share this file. SQLite runs in WAL
    # mode with a busy timeout, which is what makes that safe.
    WEBMAIL_DSN: sqlite:///data/webmail.db
    # One clock offset for every Domain, which the suite moves forward to let
    # time pass without waiting (store.OffsetClock). Shared, so every Domain's
    # timestamps stay comparable.
    WEBMAIL_CLOCK_FILE: /etc/webmail/clock/offset
    # Notifications are published to SNS as in production, but the SDK is
    # pointed at the mail sink, which captures them. The credentials are
    # placeholders the sink ignores.
    AWS_ENDPOINT_URL_SNS: http://mailsink:4566
    AWS_ACCESS_KEY_ID: mailsink
    AWS_SECRET_ACCESS_KEY: mailsink
    AWS_EC2_METADATA_DISABLED: "true"
    WEBMAIL_SNS_REGION: eu-west-1
    # Room for a 25 MiB attachment in base64, the RFC's default cap, with the
    # nginx client_max_body_size to match.
    WEBMAIL_MAX_BODY_BYTES: "50331648"
    WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json

x-worker-env: &worker-env
  <<: *api-env
  WEBMAIL_BACKFILL_PROBE: 10s
  WEBMAIL_WORKER_INTERVAL_SECONDS: "1"

# The worker serves nothing to check, so it is healthy while it runs. Without a
# check at all, `up --wait` (../up.sh) refuses to wait for it.
x-worker-health: &worker-health
  test: ["CMD-SHELL", "kill -0 1"]
  interval: 5s
  start_period: 0s

x-web: &web
  image: ${WEBMAIL_CLIENT_IMAGE:-webmail-client:local}
  pull_policy: missing
  restart: unless-stopped

services:
  # ── 103mail.com ────────────────────────────────────────────────────────────
  api-103mail:
    <<: *api
    labels:
      webmail.domain: 103mail.com
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.103mail.com
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:103mail-com
      WEBMAIL_CONTROL_ADDR: ":8081"
    volumes: &volumes-103mail
      - ./data/103mail.com:/data
      - ${FEDERATION_CONFIG_103MAIL_COM:-./domain/103mail.com/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-103mail:
        aliases: [api]
      federation:
        aliases: [control.webmail.103mail.com]

  web-103mail:
    <<: *web
    labels:
      webmail.domain: 103mail.com
    environment:
      WEBMAIL_DOMAIN: 103mail.com
    volumes: &web-volumes
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
      federation:
        aliases: [webmail.103mail.com]

  worker-103mail:
    <<: *api
    labels:
      webmail.domain: 103mail.com
    entrypoint: ["webmail-worker"]
    environment:
      <<: *worker-env
      # The RFC's 72 hours unless a story shortens it.
      WEBMAIL_RETRY_BUDGET: ${RETRY_BUDGET_103MAIL_COM:-72h}
    volumes: *volumes-103mail
    healthcheck: *worker-health
    # The API creates the schema in an empty database file, so the worker
    # starts after it.
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
      federation:

  # ── example.com ────────────────────────────────────────────────────────────
  api-example:
    <<: *api
    labels:
      webmail.domain: example.com
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.example.com
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:example-com
      WEBMAIL_CONTROL_ADDR: ":8081"
    volumes: &volumes-example
      - ./data/example.com:/data
      - ${FEDERATION_CONFIG_EXAMPLE_COM:-./domain/example.com/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-example:
        aliases: [api]
      federation:
        aliases: [control.webmail.example.com]

  web-example:
    <<: *web
    labels:
      webmail.domain: example.com
    environment:
      WEBMAIL_DOMAIN: example.com
    volumes: *web-volumes
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
      federation:
        aliases: [webmail.example.com]

  worker-example:
    <<: *api
    labels:
      webmail.domain: example.com
    entrypoint: ["webmail-worker"]
    environment:
      <<: *worker-env
      WEBMAIL_RETRY_BUDGET: ${RETRY_BUDGET_EXAMPLE_COM:-72h}
    volumes: *volumes-example
    healthcheck: *worker-health
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
      federation:

  # ── mail.acme.test ─────────────────────────────────────────────────────────
  # A Domain on a subdomain (RFC 4.1.1). It is not acme.test and shares
  # nothing with it: its own key, its own database, its own hostname.
  api-acme:
    <<: *api
    labels:
      webmail.domain: mail.acme.test
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.mail.acme.test
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:mail-acme-test
      WEBMAIL_CONTROL_ADDR: ":8081"
    volumes: &volumes-acme
      - ./data/mail.acme.test:/data
      - ${FEDERATION_CONFIG_MAIL_ACME_TEST:-./domain/mail.acme.test/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-acme:
        aliases: [api]
      federation:
        aliases: [control.webmail.mail.acme.test]

  web-acme:
    <<: *web
    labels:
      webmail.domain: mail.acme.test
    environment:
      WEBMAIL_DOMAIN: mail.acme.test
    volumes: *web-volumes
    depends_on:
      api-acme:
        condition: service_healthy
    networks:
      dom-acme:
      federation:
        aliases: [webmail.mail.acme.test]

  worker-acme:
    <<: *api
    labels:
      webmail.domain: mail.acme.test
    entrypoint: ["webmail-worker"]
    environment:
      <<: *worker-env
      WEBMAIL_RETRY_BUDGET: ${RETRY_BUDGET_MAIL_ACME_TEST:-72h}
    volumes: *volumes-acme
    healthcheck: *worker-health
    depends_on:
      api-acme:
        condition: service_healthy
    networks:
      dom-acme:
      federation:

  # ── acme.test ──────────────────────────────────────────────────────────────
  # The parent of mail.acme.test, and a separate Domain. The services are
  # called "parent" because "acme" is mail.acme.test.
  api-parent:
    <<: *api
    labels:
      webmail.domain: acme.test
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.acme.test
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:acme-test
      WEBMAIL_CONTROL_ADDR: ":8081"
    volumes: &volumes-parent
      - ./data/acme.test:/data
      - ${FEDERATION_CONFIG_ACME_TEST:-./domain/acme.test/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-parent:
        aliases: [api]
      federation:
        aliases: [control.webmail.acme.test]

  web-parent:
    <<: *web
    labels:
      webmail.domain: acme.test
    environment:
      WEBMAIL_DOMAIN: acme.test
    volumes: *web-volumes
    depends_on:
      api-parent:
        condition: service_healthy
    networks:
      dom-parent:
      federation:
        aliases: [webmail.acme.test]

  worker-parent:
    <<: *api
    labels:
      webmail.domain: acme.test
    entrypoint: ["webmail-worker"]
    environment:
      <<: *worker-env
      WEBMAIL_RETRY_BUDGET: ${RETRY_BUDGET_ACME_TEST:-72h}
    volumes: *volumes-parent
    healthcheck: *worker-health
    depends_on:
      api-parent:
        condition: service_healthy
    networks:
      dom-parent:
      federation:

  # ── peer.test ──────────────────────────────────────────────────────────────
  # The scripted peer. A Domain like the others, so it publishes a real
  # descriptor from its own key, but nobody uses it: the stories sign
  # envelopes with keys/peer.test.ed25519.pem and send forged, replayed and
  # malformed traffic as it. No worker, because it never sends anything.
  api-peer:
    <<: *api
    labels:
      webmail.domain: peer.test
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.peer.test
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:peer-test
    volumes:
      - ./data/peer.test:/data
      - ./domain/peer.test/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-peer:
        aliases: [api]
      federation:

  web-peer:
    <<: *web
    labels:
      webmail.domain: peer.test
    environment:
      WEBMAIL_DOMAIN: peer.test
    volumes: *web-volumes
    depends_on:
      api-peer:
        condition: service_healthy
    networks:
      dom-peer:
      federation:
        aliases: [webmail.peer.test]

  # ── Shared ─────────────────────────────────────────────────────────────────
  # Every Domain's federation inbound endpoint goes through here, and is
  # passed to that Domain's API unchanged unless a story arms a fault. The
  # stories arm it at http://faults:8026/faults.
  faults:
    image: ${WEBMAIL_FAULTS_IMAGE:-webmail-faults:local}
    pull_policy: missing
    restart: unless-stopped
    environment:
      FAULTS_UPSTREAMS: >-
        103mail.com=api-103mail:8080,example.com=api-example:8080,mail.acme.test=api-acme:8080,acme.test=api-parent:8080,peer.test=api-peer:8080
    networks:
      federation:
        aliases: [faults]

  # Stands in for SNS for every Domain, so notification email is captured
  # rather than sent. The stories read it at http://mailsink:4566/messages to
  # find invitations and to prove that no message content left any Domain.
  mailsink:
    image: ${WEBMAIL_MAILSINK_IMAGE:-webmail-mailsink:local}
    pull_policy: missing
    restart: unless-stopped
    networks:
      federation:
        aliases: [mailsink]

networks:
  dom-103mail:
    internal: true
  dom-example:
    internal: true
  dom-acme:
    internal: true
  dom-parent:
    internal: true
  dom-peer:
    internal: true
  federation:
